<title>PDF 算法编辑器</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #e2e0da;
    --text: #2c2c2a;
    --text-dim: #6b6a66;
    --accent: #534ab7;
    --accent-soft: #eeedfe;
    --danger: #a32d2d;
    --ok: #0f6e56;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }

  /* ---- 顶栏 ---- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .spacer { flex: 1; }

  button, select, label.file-btn {
    font: inherit; font-size: 13px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled), label.file-btn:hover { background: #f0efeb; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #453ca3; }
  button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  input[type=file] { display: none; }

  /* ---- 工具栏 ---- */
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .toolgroup { display: flex; gap: 4px; align-items: center; padding-right: 12px; border-right: 1px solid var(--border); }
  .toolgroup:last-child { border-right: none; }
  .toolgroup b { font-weight: 400; font-size: 12px; color: var(--text-dim); margin-right: 4px; }
  input[type=color] { width: 30px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
  input[type=range] { width: 90px; }

  /* ---- 主体 ---- */
  #main { flex: 1; display: flex; overflow: hidden; }
  #pages { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .page-wrap { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.13); }
  .page-wrap canvas { display: block; cursor: default; }
  .page-wrap.annotating canvas { cursor: crosshair; }
  .page-no {
    position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--text-dim);
    background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 4px; pointer-events: none;
  }
  .page-wrap.selected { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 侧栏 ---- */
  #side {
    width: 290px; background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #side .sec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #side .sec h3 { font-size: 13px; font-weight: 500; margin: 0 0 8px; color: var(--text); }
  #side .sec .hint { font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .kv span:first-child { color: var(--text-dim); }
  .kv span:last-child { font-variant-numeric: tabular-nums; }
  #textout {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #faf9f7; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  #log { font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--text-dim); max-height: 150px; overflow: auto; }
  #log .err { color: var(--danger); }
  #log .warn { color: #854f0b; }
  #log .ok { color: var(--ok); }

  /* ---- 空状态 ---- */
  #empty { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  #empty h2 { font-size: 16px; font-weight: 500; color: var(--text); margin: 0 0 8px; }
  #empty p { margin: 4px 0; font-size: 13px; }

  /* ---- 拖放遮罩 ---- */
  #drop {
    position: fixed; inset: 0; background: rgba(83,74,183,.10);
    border: 3px dashed var(--accent); display: none; z-index: 99;
    align-items: center; justify-content: center; font-size: 18px; color: var(--accent);
  }
  body.dragging #drop { display: flex; }
</style>
</head>
